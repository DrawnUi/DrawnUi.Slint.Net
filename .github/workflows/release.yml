name: Release NuGet

# Publishes DrawnUi.Slint.Net to nuget.org and GitHub Packages.
# To release: set <Version> in DrawnUi/DrawnUi.Slint.Net.csproj, push it, then publish a GitHub release
# (or run this workflow by hand from the Actions tab).
# nuget.org access is keyless (trusted publishing): the run gets a short-lived key for this repo and this file.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # nuget.org trusted publishing
      packages: write   # GitHub Packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack DrawnUi/DrawnUi.Slint.Net.csproj -c Release -p:ContinuousIntegrationBuild=true -o out

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "out/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push "out/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/DrawnUi/index.json --skip-duplicate --no-symbols
